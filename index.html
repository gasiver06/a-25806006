<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🍓 딸기구름 카페 - 나만의 카페 운영 게임</title>
<!-- 귀엽고 가독성 좋은 한글 폰트 (오프라인이면 시스템 폰트로 대체) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* =========================================================
   1. 기본 테마 / 색상 변수
   ========================================================= */
:root{
  --cream:#fff8f0; --cream2:#fff1e4; --pink:#ffe1ea; --pink2:#ffc9d8;
  --berry:#ff5c8a; --berry-d:#e8436f; --coral:#ff8a7a; --brown:#7a4b3a; --brown-l:#a8725c;
  --gold:#f5b942; --mint:#7fd1b9; --text:#5a3a2e; --muted:#a88b80;
  --shadow:0 6px 18px rgba(201,120,130,.18); --shadow-s:0 3px 8px rgba(201,120,130,.18);
  --r:20px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 10%, #ffe6ee 0 120px, transparent 121px),
    radial-gradient(circle at 90% 80%, #ffeede 0 160px, transparent 161px),
    linear-gradient(180deg,var(--cream),#ffeef3);
  background-attachment:fixed;
  min-height:100%;
  overflow-x:hidden;
}
h1,h2,h3,.jua,button{font-family:'Jua','Gowun Dodum',sans-serif;font-weight:400}
button{border:none;cursor:pointer;color:inherit;font-size:inherit}

/* =========================================================
   2. 공통 버튼 (둥근 모서리 + 부드러운 그림자 + 눌림 피드백)
   ========================================================= */
.btn{
  position:relative;overflow:hidden;
  padding:11px 18px;border-radius:999px;
  background:#fff;color:var(--brown);
  box-shadow:var(--shadow-s);font-size:15px;
  transition:transform .12s, box-shadow .12s, background .2s;
  min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  user-select:none;
}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn:active{transform:scale(.94)}
.btn.primary{background:linear-gradient(135deg,var(--berry),var(--coral));color:#fff}
.btn.gold{background:linear-gradient(135deg,#ffd36e,var(--gold));color:#6b4300}
.btn.brown{background:linear-gradient(135deg,var(--brown-l),var(--brown));color:#fff}
.btn.mint{background:linear-gradient(135deg,#a6e8d4,var(--mint));color:#24584a}
.btn.ghost{background:var(--cream2);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;filter:grayscale(.4)}
.btn.sm{padding:7px 12px;min-height:34px;font-size:13px}
.btn.big{padding:15px 26px;font-size:18px}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.6);transform:scale(0);animation:ripple .55s ease-out;pointer-events:none}
@keyframes ripple{to{transform:scale(4);opacity:0}}

/* =========================================================
   3. 헤더 (카페 이름, 코인, 레벨/경험치, 오늘 매출, 손님 수)
   ========================================================= */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(255,248,240,.92);backdrop-filter:blur(8px);
  border-bottom:2px dashed var(--pink2);
  padding:10px 16px;
}
.head-row{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo-badge{
  width:48px;height:48px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff 0 18%,transparent 19%),linear-gradient(135deg,var(--berry),var(--coral));
  display:grid;place-items:center;font-size:26px;box-shadow:var(--shadow-s);border:3px solid #fff;
  animation:bob 3s ease-in-out infinite;
}
@keyframes bob{50%{transform:translateY(-3px) rotate(-5deg)}}
.logo h1{font-size:22px;color:var(--berry-d);line-height:1.1}
.logo small{font-size:12px;color:var(--muted);display:block}
.stats{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;align-items:center}
.chip{
  background:#fff;border-radius:999px;padding:6px 12px;box-shadow:var(--shadow-s);
  display:flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap
}
.chip b{font-family:'Jua';font-weight:400;font-size:16px}
.chip.coin b{color:#c98a00}
.lvl-chip{min-width:150px}
.expbar{flex:1;height:9px;border-radius:9px;background:var(--pink);overflow:hidden;min-width:60px}
.expbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--berry));border-radius:9px;transition:width .5s}
.icon-btn{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:var(--shadow-s);font-size:18px;display:grid;place-items:center;transition:transform .12s}
.icon-btn:active{transform:scale(.88)}
.open-dot{width:9px;height:9px;border-radius:50%;background:#ccc;display:inline-block}
.open-dot.on{background:#4fd18b;box-shadow:0 0 0 3px #c9f5dc;animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(79,209,139,.15)}}

/* =========================================================
   4. 탭 네비게이션 (PC: 상단 / 모바일: 하단 고정)
   ========================================================= */
nav.tabs{max-width:1180px;margin:14px auto 0;padding:0 16px;display:flex;gap:8px;overflow-x:auto}
.tab{
  flex:1;min-width:92px;padding:10px 8px;border-radius:16px;background:#fff;box-shadow:var(--shadow-s);
  display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;position:relative;
  transition:transform .15s,background .2s;
}
.tab .ti{font-size:22px}
.tab.active{background:linear-gradient(135deg,var(--berry),var(--coral));color:#fff;transform:translateY(-2px)}
.tab:active{transform:scale(.93)}
.tab .badge{position:absolute;top:4px;right:10px;background:var(--gold);color:#5b3a00;font-size:11px;border-radius:999px;padding:1px 6px;font-family:'Jua'}

main{max-width:1180px;margin:0 auto;padding:16px 16px 40px}
.screen{display:none}
.screen.active{display:block;animation:screenIn .38s cubic-bezier(.2,.8,.3,1.2)}
@keyframes screenIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}

.panel{background:rgba(255,255,255,.88);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.panel h2{font-size:21px;color:var(--brown);margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h2 .sub{font-family:'Gowun Dodum';font-size:13px;color:var(--muted)}
.grid{display:grid;gap:14px}
.muted{color:var(--muted);font-size:13px}

/* =========================================================
   5. 메인 카페 화면 (카페 내부 씬)
   ========================================================= */
.cafe-layout{display:grid;grid-template-columns:1fr 300px;gap:16px}
.scene{
  position:relative;border-radius:24px;overflow:hidden;height:440px;box-shadow:var(--shadow);
  border:5px solid #fff;
}
.scene .wall{position:absolute;inset:0 0 34% 0;transition:background .5s}
.scene .floor{position:absolute;left:0;right:0;bottom:0;height:34%;transition:background .5s;border-top:6px solid rgba(122,75,58,.25)}
.sign{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);
  background:#fff;padding:6px 18px;border-radius:14px;box-shadow:var(--shadow-s);
  font-family:'Jua';color:var(--berry-d);font-size:17px;white-space:nowrap;border:2px solid var(--pink2)
}
.sign .open-tag{font-size:12px;margin-left:6px;padding:2px 8px;border-radius:999px;background:#eee;color:#888}
.sign .open-tag.on{background:#d8f7e6;color:#279b5c}
.window{position:absolute;top:58px;left:5%;width:110px;height:90px;border-radius:50px 50px 8px 8px;background:linear-gradient(#bfe7ff,#e8f7ff);border:6px solid #fff;box-shadow:inset 0 0 0 3px #f3d9cc}
.window::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:5px;background:#fff;transform:translateX(-50%)}
.window .cloud{position:absolute;font-size:22px;top:20px;animation:drift 9s linear infinite}
@keyframes drift{from{left:-30px}to{left:110px}}
.deco-light{position:absolute;top:0;left:36%;font-size:34px;transform-origin:top center;animation:swing 3s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(255,210,100,.7))}
.deco-light::before{content:"";position:absolute;left:50%;top:-40px;width:2px;height:40px;background:#a8725c}
.deco-light.l2{left:64%}
@keyframes swing{50%{transform:rotate(6deg)}}
.deco-wall{position:absolute;top:66px;right:6%;font-size:46px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.12))}
.deco-plant{position:absolute;bottom:22%;right:2%;font-size:58px;z-index:3;filter:drop-shadow(0 6px 4px rgba(0,0,0,.15))}
.counter{
  position:absolute;left:3%;bottom:30%;width:170px;height:78px;z-index:2;
  background:linear-gradient(#c58a6c,#9c654d);border-radius:14px 14px 6px 6px;box-shadow:0 8px 0 #7a4b3a;
}
.counter::before{content:"";position:absolute;top:-10px;left:-6px;right:-6px;height:16px;background:#ffe1ea;border-radius:10px;box-shadow:0 3px 0 #f2b9c9}
.counter .machine{position:absolute;top:-52px;left:14px;font-size:38px}
.counter .barista{position:absolute;top:-64px;left:76px;font-size:48px;animation:bob 2.4s ease-in-out infinite}
.counter .cake{position:absolute;top:-34px;right:6px;font-size:26px}
.counter .label{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#fff;font-family:'Jua';font-size:14px;opacity:.9}

.seats{
  position:absolute;left:40%;right:9%;bottom:6%;top:40%;
  display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:6px 10px;z-index:4
}
.seat{position:relative;display:flex;align-items:flex-end;justify-content:center;cursor:pointer}
.seat .table{
  position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
  width:62px;height:16px;border-radius:50%;box-shadow:0 5px 0 rgba(0,0,0,.18);
}
.seat .table::after{content:"";position:absolute;left:50%;top:10px;width:8px;height:22px;transform:translateX(-50%);background:inherit;filter:brightness(.8);border-radius:3px;z-index:-1}
.seat .chair{position:absolute;bottom:2px;left:2px;font-size:26px}
.seat .guest{position:relative;font-size:40px;bottom:14px;animation:enter .6s cubic-bezier(.3,1.6,.5,1)}
.seat.empty .guest{display:none}
.seat .bubble{
  position:absolute;bottom:62px;left:50%;transform:translateX(-50%);
  background:#fff;border-radius:14px;padding:3px 7px 6px;box-shadow:var(--shadow-s);
  display:flex;flex-direction:column;align-items:center;min-width:54px;z-index:5;animation:pop .4s
}
.seat .bubble::after{content:"";position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#fff;border-bottom:0}
.seat.empty .bubble{display:none}
.seat.selected .bubble{outline:3px solid var(--berry)}
.seat .regular{position:absolute;top:-6px;right:-6px;font-size:14px}
@keyframes enter{0%{transform:translateY(30px) scale(.3);opacity:0}100%{transform:none;opacity:1}}
@keyframes pop{0%{transform:translateX(-50%) scale(.3)}70%{transform:translateX(-50%) scale(1.1)}100%{transform:translateX(-50%) scale(1)}}
.leave-happy{animation:leaveUp .9s forwards!important}
.leave-sad{animation:leaveShake .9s forwards!important}
@keyframes leaveUp{30%{transform:translateY(-12px) scale(1.15)}100%{transform:translateY(-60px);opacity:0}}
@keyframes leaveShake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}100%{transform:translateX(40px);opacity:0}}

.patbar{width:46px;height:6px;border-radius:6px;background:#f2e3dc;overflow:hidden;margin-top:3px}
.patbar i{display:block;height:100%;background:#4fd18b;border-radius:6px;transition:width .25s linear,background .3s}

.side .panel+.panel{margin-top:14px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--cream2);border-radius:16px;padding:12px;text-align:center}
.stat .v{font-family:'Jua';font-size:22px;color:var(--berry-d)}
.stat .k{font-size:12px;color:var(--muted)}
.actions{display:flex;flex-direction:column;gap:10px}
.closed-hint{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;
  background:rgba(255,248,240,.55);backdrop-filter:blur(1.5px);z-index:10;
}
.closed-hint .card{background:#fff;padding:18px 24px;border-radius:20px;box-shadow:var(--shadow);text-align:center}

/* =========================================================
   6. 컵 / 디저트 일러스트 (CSS로 그린 음료)
   ========================================================= */
.cup{position:relative;width:44px;height:52px;display:inline-block;flex-shrink:0}
.cup .cup-body{position:absolute;bottom:0;left:3px;width:32px;height:38px;background:#fff;border:2px solid #edd5c8;border-radius:4px 4px 13px 13px;overflow:hidden}
.cup .liquid{position:absolute;left:0;right:0;bottom:0;height:72%;border-radius:0 0 10px 10px}
.cup .liquid::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:rgba(255,255,255,.35)}
.cup .cup-handle{position:absolute;right:1px;top:21px;width:11px;height:15px;border:3px solid #edd5c8;border-left:none;border-radius:0 9px 9px 0}
.cup .cup-top{position:absolute;top:-2px;left:50%;transform:translateX(-62%);font-size:15px;line-height:1;z-index:2}
.cup .straw{position:absolute;bottom:26px;left:20px;width:4px;height:24px;background:repeating-linear-gradient(#ff8fab 0 4px,#fff 4px 8px);transform:rotate(12deg);border-radius:2px}
.dessert{display:inline-block;font-size:38px;line-height:52px;width:44px;text-align:center;flex-shrink:0;filter:drop-shadow(0 3px 2px rgba(0,0,0,.12))}
.mini .cup{transform:scale(.62);transform-origin:center;margin:-10px -8px}
.mini .dessert{font-size:24px;line-height:30px;width:30px}
.huge .cup{transform:scale(2.3);margin:40px 30px}
.huge .dessert{font-size:100px;line-height:120px;width:120px}

/* =========================================================
   7. 음료 제조 화면
   ========================================================= */
.brew-layout{display:grid;grid-template-columns:290px 1fr;gap:16px}
.orders{display:flex;flex-direction:column;gap:10px;max-height:560px;overflow-y:auto;padding:4px}
.order{
  display:flex;gap:10px;align-items:center;background:#fff;border-radius:18px;padding:10px;box-shadow:var(--shadow-s);
  cursor:pointer;border:3px solid transparent;transition:transform .15s,border .15s;animation:enterCard .4s
}
@keyframes enterCard{from{opacity:0;transform:translateX(-20px)}}
.order:hover{transform:translateX(3px)}
.order.sel{border-color:var(--berry);background:#fff6f9}
.order .face{font-size:36px}
.order .info{flex:1;min-width:0}
.order .nm{font-family:'Jua';font-size:15px}
.order .what{font-size:13px;color:var(--muted)}
.order .patbar{width:100%}
.empty-box{padding:26px 14px;text-align:center;color:var(--muted);background:var(--cream2);border-radius:18px;line-height:1.7}

.workbench{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.station{
  background:linear-gradient(180deg,#fff,#fff4f7);border-radius:22px;padding:18px;min-height:300px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;position:relative
}
.glass{
  width:150px;height:170px;border:5px solid #f3d2dc;border-top:none;border-radius:0 0 40px 40px;
  background:rgba(255,255,255,.7);position:relative;display:flex;flex-wrap:wrap-reverse;align-content:flex-start;justify-content:center;
  gap:2px;padding:8px;font-size:30px;overflow:hidden
}
.glass span{animation:drop .45s cubic-bezier(.3,1.5,.6,1)}
@keyframes drop{from{transform:translateY(-90px);opacity:0}}
.glass.shake{animation:shake .25s linear infinite}
@keyframes shake{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.progress{width:180px;height:12px;background:var(--pink);border-radius:9px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--berry));transition:width 1.3s linear}
.target-card{background:var(--cream2);border-radius:16px;padding:10px 14px;width:100%;display:flex;align-items:center;gap:10px;text-align:left}
.hint{font-size:13px;margin-top:4px;color:var(--brown-l);background:#fff;border-radius:10px;padding:4px 8px;display:inline-block}
.ing-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:9px}
.ing{
  background:#fff;border-radius:16px;padding:10px 4px;box-shadow:var(--shadow-s);display:flex;flex-direction:column;align-items:center;gap:2px;
  transition:transform .12s,background .15s;border:3px solid transparent;min-height:78px
}
.ing:active{transform:scale(.9)}
.ing .e{font-size:28px}
.ing .n{font-size:12.5px}
.ing .c{font-size:11px;color:#c98a00}
.ing.on{border-color:var(--berry);background:#fff0f5;transform:translateY(-3px)}
.brew-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}

/* =========================================================
   8. 메뉴 / 상점 / 손님 카드
   ========================================================= */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:#fff;border-radius:20px;padding:14px;box-shadow:var(--shadow-s);position:relative;display:flex;flex-direction:column;gap:8px;transition:transform .2s;animation:enterCard2 .4s both}
@keyframes enterCard2{from{opacity:0;transform:translateY(14px)}}
.card:hover{transform:translateY(-3px)}
.card.locked{background:#f6eeea;filter:grayscale(.6)}
.card .top{display:flex;align-items:center;gap:10px}
.card .title{font-family:'Jua';font-size:17px}
.card .price{color:#c98a00;font-family:'Jua'}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--pink);color:var(--berry-d)}
.tag.gold{background:#fff1cc;color:#9a6b00}
.tag.mint{background:#d9f5ec;color:#2a7a62}
.tag.gray{background:#eee;color:#888}
.recipe{display:flex;flex-wrap:wrap;gap:4px}
.recipe span{background:var(--cream2);border-radius:10px;padding:2px 7px;font-size:12px}
.pop{height:8px;background:var(--pink);border-radius:8px;overflow:hidden}
.pop i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--berry))}
.lockmsg{position:absolute;top:10px;right:10px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filter{padding:8px 14px;border-radius:999px;background:#fff;box-shadow:var(--shadow-s);font-size:14px;transition:transform .12s}
.filter.on{background:var(--brown);color:#fff}
.filter:active{transform:scale(.92)}
.shop-preview{height:74px;border-radius:14px;display:grid;place-items:center;font-size:40px;position:relative;overflow:hidden}
.tbl-prev{width:80px;height:22px;border-radius:50%;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.satbar{height:9px;background:#f2e3dc;border-radius:9px;overflow:hidden}
.satbar i{display:block;height:100%;border-radius:9px}

/* =========================================================
   9. 정산 화면
   ========================================================= */
.sales-top{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.money{background:#fff;border-radius:18px;padding:14px;box-shadow:var(--shadow-s);text-align:center}
.money .v{font-family:'Jua';font-size:24px}
.money.in .v{color:#2e9d63} .money.out .v{color:#e2556a} .money.net .v{color:#c98a00}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:center;border-bottom:1px dashed #f0d6cc}
th{font-family:'Jua';font-weight:400;color:var(--brown-l)}
.bars .row{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13.5px}
.bars .row .lbl{width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .row .bar{flex:1;height:14px;background:var(--pink);border-radius:9px;overflow:hidden}
.bars .row .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--berry));border-radius:9px;transition:width .6s}
.ledger{max-height:300px;overflow-y:auto}
.ledger .li{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px dashed #f0d6cc;font-size:13.5px}
.ledger .plus{color:#2e9d63;font-family:'Jua'} .ledger .minus{color:#e2556a;font-family:'Jua'}

/* =========================================================
   10. 모달 / 토스트 / 이펙트
   ========================================================= */
.modal-bg{position:fixed;inset:0;background:rgba(90,58,46,.35);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal-bg.show{display:flex;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
.modal{background:var(--cream);border-radius:26px;padding:24px;max-width:430px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.2);text-align:center;animation:modalIn .4s cubic-bezier(.3,1.5,.5,1);max-height:90vh;overflow-y:auto;border:4px solid #fff}
@keyframes modalIn{from{transform:scale(.7);opacity:0}}
.modal h2{color:var(--berry-d);font-size:24px;margin-bottom:8px}
.modal p{line-height:1.6;margin-bottom:10px}
.modal .row-btns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.modal input[type=text]{width:100%;padding:12px 16px;border-radius:14px;border:2px solid var(--pink2);font-size:16px;font-family:inherit;color:var(--text);background:#fff;outline:none;text-align:center}
.modal input[type=text]:focus{border-color:var(--berry)}
.big-emoji{font-size:64px;animation:bob 2s infinite}
.unlock-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.unlock-list span{background:#fff;border-radius:12px;padding:5px 10px;font-size:13px;box-shadow:var(--shadow-s)}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px dashed var(--pink2);gap:10px}

#toasts{position:fixed;top:84px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:92%;max-width:380px}
.toast{background:#fff;border-radius:999px;padding:10px 18px;box-shadow:var(--shadow);font-size:14.5px;animation:toastIn .35s cubic-bezier(.3,1.5,.5,1), toastOut .4s 2.3s forwards;border:2px solid var(--pink2);text-align:center}
.toast.good{border-color:#9ee6bf}.toast.bad{border-color:#ffb3b3}.toast.gold{border-color:var(--gold)}
@keyframes toastIn{from{transform:translateY(-20px) scale(.8);opacity:0}}
@keyframes toastOut{to{transform:translateY(-14px);opacity:0}}
.floater{position:fixed;z-index:250;font-family:'Jua';font-size:20px;color:#c98a00;pointer-events:none;animation:floatUp 1.3s forwards;text-shadow:0 2px 0 #fff,0 0 6px #fff;white-space:nowrap}
@keyframes floatUp{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{transform:translate(-50%,-10px) scale(1.15);opacity:1}100%{transform:translate(-50%,-70px);opacity:0}}
.confetti{position:fixed;top:-20px;z-index:260;font-size:22px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.18)}}

/* =========================================================

@media (max-width:980px){

}

}

}

  {id:'de_teddy', cat:'decor', n:'곰인형',          e:'🧸', price:170, lv:3, fx:{freq:10}},
  {id:'de_radio', cat:'decor', n:'레트로 라디오',   e:'📻', price:290, lv:5, fx:{freq:15}},
  {id:'de_neon',  cat:'decor', n:'하트 네온사인',   e:'💖', price:540, lv:8, fx:{freq:20}},

];
const ITEM_MAP = Object.fromEntries(ITEMS.map(i=>[i.id,i]));

const MAX_LEVEL = 10;
const needExp = lv => 50 + lv*35;          // 레벨업에 필요한 경험치
const SAVE_KEY = 'berryCloudCafe_save_v1';

/* =========================================================
   [2] 게임 상태 (저장되는 데이터 S / 실행 중 데이터 R)
   ========================================================= */
function newState(){
  return {
    started:false, cafeName:'딸기구름 카페', coins:200, level:1, exp:0,
    totalRevenue:0, totalExpense:0,

    history:[], sales:{}, ledger:[],
    owned:['wp_cream','fl_wood','tb_basic','ch_basic'],
    equipped:{wallpaper:'wp_cream',floor:'fl_wood',table:'tb_basic',chair:'ch_basic',light:null,plant:null,decor:null},
    guests:{}, // 손님별 {visits, sat}
    muted:false
  };
}
let S = newState();
const R = { open:false, customers:[], selected:null, uid:0, nextSpawn:0, screen:'cafe', shopCat:'all', menuCat:'all',
            brew:{picked:[], result:null, brewing:false}, hint:false };

// 저장 & 불러오기 (localStorage)
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw), base = newState();
    S = Object.assign(base, d);
    S.today = Object.assign(newState().today, d.today||{});
    S.equipped = Object.assign(newState().equipped, d.equipped||{});
    return true;

/* =========================================================
   [3] 유틸 함수
   ========================================================= */
const $ = s => document.querySelector(s);
const fmt = n => Math.round(n).toLocaleString('ko-KR');
const rand = a => a[Math.floor(Math.random()*a.length)];
const guest = id => (S.guests[id] ||= {visits:0, sat:50});
const isRegular = id => { const g = S.guests[id]; return !!g && g.visits>=5 && g.sat>=70; };
const unlockedMenu = () => MENU.filter(m=>m.lv<=S.level);
function bonus(){ // 장착된 인테리어 효과 합산
  const b = {seats:3, pat:0, tip:0, freq:0};
  Object.values(S.equipped).forEach(id=>{
    if(!id) return; const fx = ITEM_MAP[id].fx;
    if(fx.seats) b.seats = fx.seats;
    b.pat += fx.pat||0; b.tip += fx.tip||0; b.freq += fx.freq||0;
  });
  return b;
}
function itemIcon(m, cls=''){ // 메뉴 일러스트 (CSS 컵 / 디저트 이모지)
  if(!m) return `<span class="${cls}"><span class="cup"><span class="cup-top">❓</span><span class="cup-body"><span class="liquid" style="background:#9a8f8a"></span></span><span class="cup-handle"></span></span></span>`;
  if(m.type==='dessert') return `<span class="${cls}"><span class="dessert">${m.emoji}</span></span>`;
  return `<span class="${cls}"><span class="cup">${m.straw?'<span class="straw"></span>':''}<span class="cup-top">${m.top}</span><span class="cup-body"><span class="liquid" style="background:${m.color}"></span></span><span class="cup-handle"></span></span></span>`;
}
function addLedger(type,label,amount){

}
function addIncome(amount,label){ S.coins+=amount; S.totalRevenue+=amount; S.today.revenue+=amount; addLedger('in',label,amount); }
function addExpense(amount,label){ S.coins-=amount; S.totalExpense+=amount; S.today.expense+=amount; addLedger('out',label,amount); }

/* =========================================================
   [4] 효과음 (Web Audio API) + 음소거
   ========================================================= */
let actx = null;
function sfx(kind){
  if(S.muted) return;
  try{
    actx ||= new (window.AudioContext||window.webkitAudioContext)();
    const seq = {
      click:[[660,.05]], pick:[[880,.06]], bell:[[988,.12],[1319,.2]], coin:[[1047,.07],[1568,.14]],
      bad:[[330,.12],[247,.22]], level:[[523,.1],[659,.1],[784,.1],[1047,.3]], brew:[[440,.08],[554,.08],[659,.12]], buy:[[784,.08],[1175,.16]]
    }[kind] || [[600,.05]];
    let t = actx.currentTime;
    seq.forEach(([f,d])=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = kind==='bad'?'triangle':'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.18,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d+.02); t += d*.9;
    });
  }catch(e){}
}
function toggleMute(){ S.muted=!S.muted; save(); renderHeader(); toast(S.muted?'🔇 소리를 껐어요':'🔊 소리를 켰어요'); if(!S.muted) sfx('click'); }

/* =========================================================
   [5] 시각 효과 (토스트, 떠오르는 코인, 컨페티, 버튼 리플)
   ========================================================= */
function toast(msg, kind=''){
  const t = document.createElement('div'); t.className='toast '+kind; t.textContent=msg;
  $('#toasts').appendChild(t); setTimeout(()=>t.remove(), 2800);
  while($('#toasts').children.length>3) $('#toasts').firstChild.remove();
}
function floater(text, x, y){
  const f = document.createElement('div'); f.className='floater'; f.textContent=text;
  f.style.left = x+'px'; f.style.top = y+'px'; document.body.appendChild(f); setTimeout(()=>f.remove(),1300);
}
function floatAt(el, text){
  if(el && el.offsetParent){ const r=el.getBoundingClientRect(); floater(text, r.left+r.width/2, r.top); }
  else { const r=$('#coinChip').getBoundingClientRect(); floater(text, r.left+r.width/2, r.bottom+10); }
}
function confetti(n=40){
  const em = ['🍓','⭐','🌸','💖','✨','🪙'];
  for(let i=0;i<n;i++){
    const c = document.createElement('div'); c.className='confetti'; c.textContent=rand(em);
    c.style.left = Math.random()*100+'vw'; c.style.animationDuration = (1.8+Math.random()*1.8)+'s';
    c.style.animationDelay = Math.random()*.5+'s'; document.body.appendChild(c); setTimeout(()=>c.remove(),4200);
  }
}
function bump(sel){ const el=$(sel); if(!el) return; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
// 모든 버튼에 리플(물결) 피드백
document.addEventListener('pointerdown', e=>{
  const b = e.target.closest('.btn,.tab,.ing,.filter,.icon-btn'); if(!b || b.disabled) return;
  if(!b.classList.contains('btn')) return;
  const r = b.getBoundingClientRect(), s = Math.max(r.width,r.height);
  const rp = document.createElement('span'); rp.className='ripple';
  rp.style.width = rp.style.height = s+'px'; rp.style.left = (e.clientX-r.left-s/2)+'px'; rp.style.top = (e.clientY-r.top-s/2)+'px';
  b.appendChild(rp); setTimeout(()=>rp.remove(),600);
});

function openModal(html, closable=true){

function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* =========================================================
   [10] 영업 시작 / 마감 & 손님 방문 루프
   ========================================================= */
function openShop(){
  if(R.open) return;
  R.open = true; R.nextSpawn = Date.now()+1500;
  sfx('bell'); toast('☀️ 영업을 시작했어요! 손님이 곧 찾아와요','good');
  renderHeader(); renderScreen();
}
function closeShop(){
  if(!R.open) return;
  R.open = false; R.customers = []; R.selected = null; R.brew = {picked:[],result:null,brewing:false};
  const t = {...S.today};
  S.history.unshift(t); if(S.history.length>30) S.history.length=30;
  S.today = {day:t.day+1,revenue:0,expense:0,visitors:0,served:0,failed:0,tips:0};
  save(); sfx('coin');
  const net = t.revenue - t.expense;
  openModal(`<div class="big-emoji">🌙</div><h2>${t.day}일차 영업 마감!</h2>
    <div class="statgrid" style="margin:12px 0">
      <div class="stat"><div class="v">🪙${fmt(t.revenue)}</div><div class="k">매출 (팁 ${fmt(t.tips)} 포함)</div></div>
      <div class="stat"><div class="v" style="color:#e2556a">🪙${fmt(t.expense)}</div><div class="k">지출</div></div>
      <div class="stat"><div class="v" style="color:${net>=0?'#2e9d63':'#e2556a'}">${net>=0?'+':''}${fmt(net)}</div><div class="k">순이익</div></div>
      <div class="stat"><div class="v">${t.served}/${t.visitors}</div><div class="k">성공 / 방문</div></div>
    </div>
    <p>${net>100?'대박 났어요! 🎉':net>0?'오늘도 수고했어요 💕':'내일은 더 잘할 수 있어요! 💪'}</p>
    <div class="row-btns"><button class="btn ghost" onclick="closeModal();go('sales')">💰 정산 보기</button><button class="btn primary" onclick="closeModal();renderScreen()">확인</button></div>`);
  renderHeader(); renderScreen();
}
function spawnInterval(){ // 레벨이 높을수록, 장식 효과가 클수록 손님이 자주 방문
  return Math.max(3500, 12500 - S.level*800) * (1 - bonus().freq/100) * (0.8+Math.random()*0.4);
}
function spawnCustomer(){
  const b = bonus();
  if(R.customers.length >= b.seats) return false;
  const present = R.customers.map(c=>c.type);
  const pool = CUSTOMERS.filter(c=>c.lv<=S.level && !present.includes(c.id));
  if(!pool.length) return false;
  const t = rand(pool), menu = unlockedMenu();
  const favs = t.fav.filter(id=>MENU_MAP[id].lv<=S.level);
  const order = (favs.length && Math.random()<0.65) ? rand(favs) : rand(menu).id;
  let seat = 0; while(R.customers.some(c=>c.seat===seat)) seat++;
  const maxT = t.pat * (1 + b.pat/100) * (isRegular(t.id)?1.2:1) * 1000;
  const c = {uid:++R.uid, type:t.id, menu:order, seat, maxT, deadline:Date.now()+maxT};
  R.customers.push(c);
  S.today.visitors++; guest(t.id);
  if(!R.selected) R.selected = c.uid;
  sfx('bell'); toast(`${t.e} ${t.n}${isRegular(t.id)?' (단골💖)':''} 님이 ${MENU_MAP[order].n}을(를) 주문했어요!`);
  save(); renderHeader(); refreshLive(); bump('#todayVis');
  return true;
}
// 손님 퇴장 처리 (happy: 만족 / sad: 불만)
function removeCustomer(c, happy){
  const g = document.getElementById('guest-'+c.uid);
  if(g) g.classList.add(happy?'leave-happy':'leave-sad');
  R.customers = R.customers.filter(x=>x.uid!==c.uid);
  if(R.selected===c.uid) R.selected = R.customers[0]?.uid ?? null;
  setTimeout(()=>{ renderHeader(); refreshLive(); }, g?700:0);
}
// 메인 루프: 인내심 감소 & 손님 생성
function tick(){
  if(!R.open) return;
  const now = Date.now();
  R.customers.slice().forEach(c=>{
    if(now >= c.deadline){
      const t = CUST_MAP[c.type], g = guest(t.id);
      g.sat = Math.max(0, g.sat-10); g.visits++; S.today.failed++;
      sfx('bad'); toast(`😢 ${t.e} ${t.n} 님이 기다리다 떠났어요...`,'bad');
      removeCustomer(c,false); save();
    }
  });
  if(now >= R.nextSpawn){
    spawnCustomer();
    R.nextSpawn = now + spawnInterval();
  }
  updatePatience();
}
function updatePatience(){
  const now = Date.now();
  R.customers.forEach(c=>{
    const p = Math.max(0,(c.deadline-now)/c.maxT*100);
    document.querySelectorAll(`[data-pat="${c.uid}"]`).forEach(el=>{
      el.style.width = p+'%'; el.style.background = p>50?'#4fd18b':p>25?'#f5b942':'#ff6b6b';
    });
  });
}
// 손님 목록이 바뀌면 현재 화면에 맞춰 갱신

  if(R.screen==='cafe') renderCafe();

}

function renderStation(){

  const c = R.customers.find(x=>x.uid===R.selected);
  const target = c ? (()=>{ const t=CUST_MAP[c.type], m=MENU_MAP[c.menu];
    return `<div class="target-card">${itemIcon(m)}<div style="flex:1"><div class="jua">${t.e} ${t.n}의 주문</div><div><b>${m.n}</b></div>
      ${R.hint?`<span class="hint">📖 ${m.ing.map(i=>INGREDIENTS[i].e+' '+INGREDIENTS[i].n).join(' + ')}</span>`:`<button class="btn sm ghost" style="margin-top:4px" onclick="R.hint=true;sfx('click');renderStation()">📖 레시피 힌트</button>`}
      </div></div>`; })() : `<div class="target-card"><span style="font-size:30px">🙋</span><div class="muted">주문 목록에서 손님을 선택하세요</div></div>`;

  if(R.brew.brewing){
    st.innerHTML = `${target}<div class="glass shake">${R.brew.picked.map(i=>`<span>${INGREDIENTS[i].e}</span>`).join('')}</div>
      <div class="jua">열심히 만드는 중... 🎶</div><div class="progress"><i id="brewProg"></i></div>`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ const p=$('#brewProg'); if(p) p.style.width='100%'; }));
    return;
  }
  if(R.brew.result){
    const m = R.brew.result==='mystery'?null:MENU_MAP[R.brew.result];
    const ok = c && m && m.id===c.menu;
    st.innerHTML = `${target}<div class="huge">${itemIcon(m)}</div>
      <div class="jua" style="font-size:19px">${m?m.n:'정체불명의 음료 🤔'} 완성!</div>
      ${c?`<div class="muted">${ok?'✨ 주문과 일치해요!':'⚠️ 주문과 다른 메뉴예요'}</div>`:''}
      <div class="brew-btns">
        <button class="btn primary big" ${c?'':'disabled'} onclick="serve()">🛎️ 서빙하기</button>
        <button class="btn ghost" onclick="discard()">🗑️ 버리기</button>
      </div>`;
    return;
  }
  const cost = R.brew.picked.reduce((s,i)=>s+INGREDIENTS[i].c,0);
  st.innerHTML = `${target}
    <div class="glass">${R.brew.picked.map(i=>`<span>${INGREDIENTS[i].e}</span>`).join('') || '<span class="muted" style="font-size:13px;align-self:center;margin:auto">재료를 넣어주세요</span>'}</div>
    <div class="muted">선택 ${R.brew.picked.length}/5 · 재료비 🪙${cost}</div>
    <div class="brew-btns">
      <button class="btn primary big" ${R.brew.picked.length?'':'disabled'} onclick="brew()">✨ 제조하기</button>
      <button class="btn ghost" ${R.brew.picked.length?'':'disabled'} onclick="clearPick()">↺ 비우기</button>
    </div>`;
}
function renderIngredients(){
  const g = $('#ingGrid'); if(!g) return;
  // 해금된 메뉴에 쓰이는 재료만 표시
  const used = new Set(unlockedMenu().flatMap(m=>m.ing));
  g.innerHTML = Object.entries(INGREDIENTS).filter(([id])=>used.has(id)).map(([id,i])=>
    `<button class="ing ${R.brew.picked.includes(id)?'on':''}" onclick="toggleIng('${id}')" ${R.brew.brewing||R.brew.result?'disabled':''}>
      <span class="e">${i.e}</span><span class="n">${i.n}</span><span class="c">🪙${i.c}</span></button>`).join('');
}
function toggleIng(id){
  if(R.brew.brewing || R.brew.result) return;
  const p = R.brew.picked, idx = p.indexOf(id);
  if(idx>=0) p.splice(idx,1);
  else { if(p.length>=5){ toast('재료는 최대 5개까지 넣을 수 있어요','bad'); return; } p.push(id); }
  sfx('pick'); renderStation(); renderIngredients();
}
function clearPick(){ R.brew.picked=[]; sfx('click'); renderStation(); renderIngredients(); }
// 재료 조합을 레시피와 비교해 결과 메뉴 결정
function matchRecipe(picked){
  const key = [...picked].sort().join('|');
  const m = unlockedMenu().find(m=>[...m.ing].sort().join('|')===key);
  return m ? m.id : 'mystery';
}
function brew(){
  const p = R.brew.picked; if(!p.length || R.brew.brewing) return;
  const cost = p.reduce((s,i)=>s+INGREDIENTS[i].c,0);
  if(S.coins < cost){ toast('🪙 코인이 부족해요!','bad'); sfx('bad'); return; }
  addExpense(cost, '재료 구입 ('+p.map(i=>INGREDIENTS[i].e).join('')+')');
  R.brew.brewing = true; sfx('brew'); renderHeader(); renderStation(); renderIngredients();
  setTimeout(()=>{
    R.brew.result = matchRecipe(p); R.brew.brewing = false; R.brew.picked = [];
    sfx(R.brew.result==='mystery'?'bad':'pick'); save();
    if(R.screen==='brew'){ renderStation(); renderIngredients(); }
  }, 1300);
}
function discard(){ R.brew.result=null; sfx('click'); toast('🗑️ 음료를 버렸어요'); renderStation(); renderIngredients(); }

/* 서빙: 정확하면 가격 + 팁 + 정확 보너스, 틀리면 만족도 감소 */
function serve(){
  const c = R.customers.find(x=>x.uid===R.selected);
  if(!c || !R.brew.result) return;
  const t = CUST_MAP[c.type], m = MENU_MAP[c.menu], g = guest(t.id);
  const wasRegular = isRegular(t.id);
  const anchor = document.querySelector('.order.sel') || document.getElementById('seat-'+c.uid);
  g.visits++;
  const ok = R.brew.result === c.menu;
  if(ok){
    const ratio = Math.max(0,(c.deadline-Date.now())/c.maxT);
    const tip = Math.round(m.price * t.tip * (0.05+0.35*ratio) * (1+bonus().tip/100) * (wasRegular?1.25:1));
    const exact = 5;
    addIncome(m.price, `${m.n} 판매 (${t.n})`);
    if(tip>0){ addIncome(tip, `${t.e} 팁`); S.today.tips += tip; }
    addIncome(exact, '정확한 주문 보너스');
    S.sales[m.id] = (S.sales[m.id]||0)+1; S.today.served++;
    g.sat = Math.min(100, g.sat + 8 + (ratio>0.6?4:0));
    sfx('coin'); floatAt(anchor, `+🪙${m.price+tip+exact}`);
    toast(`${ratio>0.6?'😍':'😊'} ${t.n}: "${rand(['정말 맛있어요!','딱 제가 원하던 거예요!','또 올게요~','최고예요 💕'])}" 팁 🪙${tip}`,'good');
    gainExp(10 + Math.round(m.price/8));
    if(!wasRegular && isRegular(t.id)){ setTimeout(()=>{ toast(`💖 ${t.e} ${t.n} 님이 단골손님이 되었어요! (팁 +25%)`,'gold'); confetti(18); },700); }
  } else {
    g.sat = Math.max(0, g.sat-12); S.today.failed++;
    sfx('bad'); toast(`😠 ${t.n}: "이건 제가 주문한 ${m.n}이(가) 아니에요!" (만족도 -12)`,'bad');
    gainExp(2);
  }
  R.brew.result = null; R.hint = false;
  bump('#coinChip'); removeCustomer(c, ok);
  save(); renderHeader(); renderStation(); renderIngredients();
}

/* =========================================================
   [12] 레벨 & 경험치
   ========================================================= */
function gainExp(n){
  if(S.level>=MAX_LEVEL) return;
  S.exp += n;
  while(S.level<MAX_LEVEL && S.exp>=needExp(S.level)){
    S.exp -= needExp(S.level); S.level++;
    levelUp(S.level);
  }
  if(S.level>=MAX_LEVEL) S.exp = 0;
  renderHeader();
}
function levelUp(lv){
  const nm = MENU.filter(m=>m.lv===lv), ni = ITEMS.filter(i=>i.lv===lv), nc = CUSTOMERS.filter(c=>c.lv===lv);
  sfx('level'); confetti(50); save();
  setTimeout(()=>{
    openModal(`<div class="big-emoji">🎉</div><h2>레벨 업! Lv.${lv}</h2>
      <p>카페가 한층 더 유명해졌어요!<br>손님이 더 자주 찾아와요 🙋</p>
      ${nm.length?`<div class="jua">🍹 새 메뉴</div><div class="unlock-list">${nm.map(m=>`<span>${m.type==='dessert'?m.emoji:'🥤'} ${m.n}</span>`).join('')}</div>`:''}
      ${ni.length?`<div class="jua" style="margin-top:10px">🛍️ 새 인테리어</div><div class="unlock-list">${ni.map(i=>`<span>${i.e} ${i.n}</span>`).join('')}</div>`:''}
      ${nc.length?`<div class="jua" style="margin-top:10px">👥 새 손님</div><div class="unlock-list">${nc.map(c=>`<span>${c.e} ${c.n}</span>`).join('')}</div>`:''}
      <div class="row-btns"><button class="btn primary" onclick="closeModal();renderScreen()">좋아요! 💕</button></div>`);
  }, 500);
}

/* =========================================================
   [13] 메뉴 & 레시피 화면
   ========================================================= */
function renderMenu(){
  const maxSale = Math.max(1, ...Object.values(S.sales));
  const list = MENU.filter(m=>R.menuCat==='all'||m.type===R.menuCat);
  const unlocked = unlockedMenu().length;
  $('#screen-menu').innerHTML = `<div class="panel">
    <h2>📖 메뉴 & 레시피 <span class="sub">해금 ${unlocked}/${MENU.length} · 레벨이 오르면 새 레시피가 열려요</span></h2>
    <div class="filters">
      ${[['all','전체'],['drink','🥤 음료'],['dessert','🍰 디저트']].map(([k,l])=>`<button class="filter ${R.menuCat===k?'on':''}" onclick="R.menuCat='${k}';sfx('click');renderMenu()">${l}</button>`).join('')}
    </div>
    <div class="cards">${list.map((m,i)=>{
      const lock = m.lv>S.level, sold = S.sales[m.id]||0, pop = sold/maxSale*100;
      const cost = m.ing.reduce((s,x)=>s+INGREDIENTS[x].c,0);
      return `<div class="card ${lock?'locked':''}" style="animation-delay:${i*25}ms">
        ${lock?`<span class="lockmsg tag gray">🔒 Lv.${m.lv}</span>`:''}
        <div class="top">${itemIcon(m)}<div><div class="title">${m.n}</div><div class="price">🪙${m.price} <span class="muted">(원가 ${cost})</span></div></div></div>
        <div class="recipe">${lock?'<span>❓ 레벨 '+m.lv+'에 공개</span>':m.ing.map(x=>`<span>${INGREDIENTS[x].e} ${INGREDIENTS[x].n}</span>`).join('')}</div>
        <div class="muted">판매 ${sold}회 · 인기도 ${'★'.repeat(Math.ceil(pop/20))||'☆'}</div>
        <div class="pop"><i style="width:${pop}%"></i></div>
      </div>`;}).join('')}</div></div>`;
}

/* =========================================================
   [14] 인테리어 상점 화면
   ========================================================= */
function fxText(fx){
  const a=[]; if(fx.seats) a.push(`좌석 ${fx.seats}개`); if(fx.pat) a.push(`인내심 +${fx.pat}%`);
  if(fx.tip) a.push(`팁 +${fx.tip}%`); if(fx.freq) a.push(`방문 +${fx.freq}%`);
  return a.length?a.join(' · '):'기본 아이템';
}
function previewHTML(it){
  if(it.cat==='wallpaper'||it.cat==='floor') return `<div class="shop-preview" style="background:${it.bg}"></div>`;
  if(it.cat==='table') return `<div class="shop-preview" style="background:var(--cream2)"><div class="tbl-prev" style="background:${it.color}"></div></div>`;
  return `<div class="shop-preview" style="background:var(--cream2)">${it.e}</div>`;
}
function renderShop(){
  const cats = ['all',...Object.keys(ITEM_CATS)];
  const list = ITEMS.filter(i=>R.shopCat==='all'||i.cat===R.shopCat);
  $('#screen-shop').innerHTML = `<div class="panel">
    <h2>🛍️ 인테리어 상점 <span class="sub">보유 ${S.owned.length}/${ITEMS.length} · 구매한 아이템은 카페에 바로 적용돼요</span></h2>
    <div class="filters">${cats.map(c=>`<button class="filter ${R.shopCat===c?'on':''}" onclick="R.shopCat='${c}';sfx('click');renderShop()">${c==='all'?'✨ 전체':ITEM_CATS[c]}</button>`).join('')}</div>
    <div class="cards">${list.map((it,i)=>{
      const own = S.owned.includes(it.id), eq = S.equipped[it.cat]===it.id, lock = it.lv>S.level;
      let btn;
      if(lock) btn = `<button class="btn sm" disabled>🔒 Lv.${it.lv} 해금</button>`;
      else if(eq) btn = OPTIONAL_CATS.includes(it.cat) ? `<button class="btn sm mint" onclick="unequip('${it.cat}')">✅ 적용 중 (해제)</button>` : `<button class="btn sm mint" disabled>✅ 적용 중</button>`;
      else if(own) btn = `<button class="btn sm brown" onclick="equip('${it.id}')">🎨 적용하기</button>`;
      else btn = `<button class="btn sm gold" ${S.coins<it.price?'disabled':''} onclick="buy('${it.id}')">🪙${fmt(it.price)} 구매</button>`;
      return `<div class="card ${lock?'locked':''}" style="animation-delay:${i*20}ms">
        ${previewHTML(it)}
        <div class="title">${it.e} ${it.n}</div>
        <div><span class="tag">${ITEM_CATS[it.cat]}</span> ${own?'<span class="tag mint">보유</span>':''}</div>
        <div class="muted">${fxText(it.fx)}</div>${btn}</div>`;}).join('')}</div></div>`;
}
function buy(id){
  const it = ITEM_MAP[id];
  if(S.owned.includes(id) || it.lv>S.level) return;
  if(S.coins < it.price){ toast('🪙 코인이 부족해요!','bad'); sfx('bad'); return; }
  addExpense(it.price, `인테리어: ${it.n}`);
  S.owned.push(id); S.equipped[it.cat] = id;
  sfx('buy'); toast(`🎀 ${it.e} ${it.n}을(를) 카페에 들였어요!`,'gold'); confetti(14);
  if(it.cat==='table') clampSeats();
  save(); renderHeader(); renderShop(); bump('#coinChip');
}
function equip(id){
  const it = ITEM_MAP[id]; if(!S.owned.includes(id)) return;
  S.equipped[it.cat] = id; sfx('click'); toast(`🎨 ${it.n} 적용 완료!`,'good');
  if(it.cat==='table') clampSeats();
  save(); renderShop();
}
function unequip(cat){ S.equipped[cat]=null; sfx('click'); toast('장식을 해제했어요'); save(); renderShop(); }
// 좌석 수가 줄어든 경우 넘치는 손님은 정중히 돌려보냄 (패널티 없음)
function clampSeats(){
  const seats = bonus().seats;
  R.customers = R.customers.filter(c=>c.seat<seats);
  if(!R.customers.some(c=>c.uid===R.selected)) R.selected = R.customers[0]?.uid ?? null;
}

      <p class="muted" style="margin:10px 0">방문 ${t.visitors}명 · 성공 ${t.served} · 실패 ${t.failed}</p>

    <div class="row-btns"><button class="btn ghost" onclick="closeModal()">닫기</button></div>`);
}
function rename(){
  const v = $('#nameInput').value.trim();
  if(!v){ toast('이름을 입력해주세요','bad'); return; }
  S.cafeName = v; save(); renderHeader(); renderScreen(); closeModal(); toast(`🍓 "${v}"(으)로 이름을 바꿨어요!`,'good');
}
function confirmReset(){
  openModal(`<div class="big-emoji">⚠️</div><h2>정말 초기화할까요?</h2>
    <p>코인, 레벨, 인테리어, 손님 기록 등<br>모든 진행 상황이 사라져요.</p>
    <div class="row-btns"><button class="btn ghost" onclick="openSettings()">취소</button><button class="btn primary" onclick="resetGame()">초기화하기</button></div>`);
}
function resetGame(){
  localStorage.removeItem(SAVE_KEY);
  const muted = S.muted; S = newState(); S.muted = muted;
  Object.assign(R,{open:false,customers:[],selected:null,brew:{picked:[],result:null,brewing:false},hint:false});
  renderHeader(); go('cafe'); showWelcome();
}
function showWelcome(){
  openModal(`<div class="big-emoji">🍓</div><h2>나만의 카페 운영 게임</h2>
    <p>손님의 주문을 받고, 재료를 골라 음료와 디저트를 만들어<br>나만의 핑크 디저트 카페를 키워보세요!</p>
    <p class="muted">카페 이름을 정해주세요</p>
    <input type="text" id="startName" maxlength="14" value="${esc(S.cafeName)}">
    <div class="row-btns"><button class="btn primary big" onclick="startGame()">🎮 게임 시작</button></div>`, false);
}
function startGame(){
  const v = $('#startName').value.trim(); if(v) S.cafeName = v;
  S.started = true; save(); closeModal(); sfx('level'); confetti(30);
  renderHeader(); renderScreen();
  setTimeout(()=>toast('☀️ "영업 시작"을 눌러 첫 손님을 맞이해보세요!','gold'), 600);
}

/* =========================================================
   [18] 초기화 & 루프 시작
   ========================================================= */
load();
renderHeader(); renderScreen();
if(!S.started) showWelcome();
else toast(`💕 다시 오신 걸 환영해요! ${S.today.day}일차 영업을 준비해요`,'good');
setInterval(()=>{ tick(); }, 250);
setInterval(()=>{ if(R.open) renderHeader(); }, 1000);
</script>
</body>
</html>
